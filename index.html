<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon.png?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#38B6FF" />
    <script>
      /* Apply the saved theme before first paint so there is no flash of the wrong one. */
      try {
        var c = localStorage.getItem("pyquest:v1:theme");
        var d = c === "dark" || ((c !== "light") && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = d ? "dark" : "light";
        document.documentElement.style.colorScheme = d ? "dark" : "light";
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CoQuest — learn to code through lessons, boss battles and duels." />
    <title>CoQuest — Learn to code</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
