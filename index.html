<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Google shows the favicon next to search results. It needs a square icon whose size is a multiple of 48px. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#8A4DFF" />
    <script>
      /* Apply the saved theme before first paint so there is no flash of the wrong one. */
      try {
        var c = localStorage.getItem("pyquest:v1:theme");
        var d = c === "dark" || ((c !== "light") && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = d ? "dark" : "light";
        document.documentElement.style.colorScheme = d ? "dark" : "light";
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The block below is rewritten for every public page by scripts/prerender.ts at build time. -->
    <!--seo:head-->
    <title>CoQuest | Learn Coding Through Play</title>
    <meta name="description" content="Learn Python, JavaScript, and programming fundamentals through interactive lessons, coding quests, XP, streaks, and fun gamified learning with CoQuest." />
    <link rel="canonical" href="https://www.coquest.website" />
    <!--/seo:head-->
    <style>
      /* Shown only until the app loads (and to crawlers that do not run scripts). */
      #seo-static { max-width: 720px; margin: 0 auto; padding: 24px 20px; font: 16px/1.6 system-ui, sans-serif; color: #3c3c3c; }
      #seo-static header { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; color: #8a4dff; }
      #seo-static a { color: #1899d6; }
      #seo-static h1 { font-size: 30px; line-height: 1.2; margin: 0 0 12px; }
      html[data-theme="dark"] #seo-static { color: #f1f7fb; }
      html[data-theme="dark"] body { background: #120e1d; }
    </style>
  </head>
  <body>
    <div id="root"><!--seo:body-->
      <div id="seo-static">
        <header><strong>CoQuest</strong></header>
        <main>
          <h1>Your coding adventure starts here.</h1>
          <p>Learn to code. Level up. Build anything.</p>
        </main>
      </div>
    <!--/seo:body--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
